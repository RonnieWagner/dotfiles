set -g mouse on

# Choose the theme and window appearance.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# Load the theme. 
run ~/.local/share/tmux/plugins/catppuccin/catppuccin.tmux

# Keep the prefix indicator and clock.
set -g status-right '#{?client_prefix,#[reverse] PREFIX #[default],} %H:%M'

bind-key -N "Show shortcut help" ? display-popup -x C -y C -w 90% -h 80% -T "tmux help (Esc to close)" "tmux list-keys -N | less"
